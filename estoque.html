<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almoxarifado - Estoque</title>
    <link rel="stylesheet" href="css/estoque.css" />
  </head>
  <body>
    <div class="container-estoque">
      <header class="header-estoque">
        <h2>ALMOXARIFADO CENTRAL</h2>
        <button id="botao-sair" class="btn-sair">Sair/Deslogar</button>
      </header>

      <selection class="form-secao">
        <h3>FORMULÁRIO DE ENTRADA</h3>
        <form id="formulario-estoque" class="form-linha">
          <div class="grupo-input">
            <label for="nome-material">Nome do Material:</label>
            <input
              type="text"
              id="nome-material"
              placeholder="Ex: Saco de cimento"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="qtd-material">Quantidade:</label>
            <input
              type="number"
              id="qtd-material"
              placeholder="Ex: 50"
              min="1"
              required
            />
          </div>

          <button type="submit" class="btn-add">+ Inserir</button>
        </form>
      </selection>
    </div>
    <script src="JS/script.js"></script>
  </body>
</html>
